name: Release

# Publishes the version in package.json to npm. Runs on its own when a version tag is pushed:
#   1. Bump "version" in package.json and add the CHANGELOG entry; commit.
#   2. git tag v<version> && git push && git push origin v<version>
# Or run it by hand from the Actions tab (Release → Run workflow) on a branch: it publishes that
# branch's version and tags the commit v<version>, so step 2 is just `git push`.
#
# Uses npm trusted publishing: no npm token is stored. On npmjs.com, the package's
# Settings → Trusted publishing must list this repository and this workflow file (release.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and pack only; don't publish or tag"
        type: boolean
        default: false

permissions:
  contents: write # to push the tag on a manual run
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "spec=$(node -p "require('./package.json').name")@$version" >> "$GITHUB_OUTPUT"
          # A pushed tag must match package.json; catches tagging before bumping the version.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Pack
        run: npm pack --dry-run

      # A version already on npm (published by hand, or a re-pushed tag) is left alone.
      - name: Check npm
        id: npm
        run: |
          if npm view "${{ steps.version.outputs.spec }}" version >/dev/null 2>&1; then
            echo "${{ steps.version.outputs.spec }} is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true' && inputs.dry_run != true
        run: npm publish --access public --provenance

      - name: Tag the release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
